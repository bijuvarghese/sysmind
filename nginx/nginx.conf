events {
    worker_connections 1024;
}

http {
    # ── Upstream services ─────────────────────────────────────────────────────
    upstream sysmind_ui {
        server sysmind-ui:3000;
    }

    upstream sysmind_mcp {
        server sysmind-mcp:8080;
    }

    server {
        listen 80;
        server_name _;

        # Increase timeouts for LLM responses (can be slow)
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;

        # Common proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── LM Studio model listing (/v1/models) ──────────────────────────────
        location /v1/ {
            proxy_pass http://sysmind_mcp;
        }

        # ── Spring Boot MCP backend (/agent) ──────────────────────────────────
        location /agent {
            proxy_pass http://sysmind_mcp;
        }

        # ── Next.js UI (everything else) ──────────────────────────────────────
        location / {
            proxy_pass http://sysmind_ui;

            # WebSocket support (Next.js hot reload / future use)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
