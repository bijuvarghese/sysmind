services:

  # ── Spring Boot MCP backend ─────────────────────────────────────────────────
  sysmind-mcp:
    build:
      context: ./sysmind-mcp
      dockerfile: Dockerfile
    container_name: sysmind-mcp
    # Port no longer exposed to host — nginx proxies /mcp internally
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - NEWS_LANGUAGE=${NEWS_LANGUAGE:-en-US}
      - NEWS_COUNTRY=${NEWS_COUNTRY:-US}
      - NEWS_CEID=${NEWS_CEID:-}
      - CHROMA_URL=${CHROMA_URL:-http://chroma:8000}
      - CHROMA_TIMEOUT=${CHROMA_TIMEOUT:-5s}
      - CHROMA_TENANT=${CHROMA_TENANT:-default_tenant}
      - CHROMA_DATABASE=${CHROMA_DATABASE:-default_database}
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-sysmind}
    depends_on:
      - chroma
    restart: unless-stopped
    networks:
      - sysmind-net

  # ── Chroma vector database ──────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: sysmind-chroma
    volumes:
      - chroma-data:/data
    restart: unless-stopped
    networks:
      - sysmind-net

  # ── Next.js UI frontend ─────────────────────────────────────────────────────
  sysmind-ui:
    build:
      context: ./sysmind-ui
      dockerfile: Dockerfile
    container_name: sysmind-ui
    # Port no longer exposed to host — nginx proxies / internally
    environment:
      - MCP_BACKEND_URL=${MCP_BACKEND_URL:-http://sysmind-mcp:8080}
    depends_on:
      - sysmind-mcp
    restart: unless-stopped
    networks:
      - sysmind-net

  # ── Nginx reverse proxy (single public entry point) ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sysmind-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sysmind-ui
      - sysmind-mcp
    restart: unless-stopped
    networks:
      - sysmind-net

networks:
  sysmind-net:
    driver: bridge

volumes:
  chroma-data:
