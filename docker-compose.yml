services:

  # ── Spring Boot MCP backend ─────────────────────────────────────────────────
  sysmind-mcp:
    build:
      context: ./sysmind-mcp
      dockerfile: Dockerfile
    container_name: sysmind-mcp
    # Port no longer exposed to host — nginx proxies /mcp internally
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - NEWS_LANGUAGE=${NEWS_LANGUAGE:-en-US}
      - NEWS_COUNTRY=${NEWS_COUNTRY:-US}
      - NEWS_CEID=${NEWS_CEID:-}
      - CHROMA_URL=${MCP_CHROMA_URL:-http://chroma:8000}
      - CHROMA_TIMEOUT=${CHROMA_TIMEOUT:-5s}
      - CHROMA_TENANT=${CHROMA_TENANT:-default_tenant}
      - CHROMA_DATABASE=${CHROMA_DATABASE:-default_database}
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-sysmind}
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - sysmind-net

  # ── Chroma vector database ──────────────────────────────────────────────────
  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.0}
    container_name: sysmind-chroma
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/healthcheck', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - sysmind-net

  # ── Spring Boot agent service ───────────────────────────────────────────────
  sysmind-agent:
    build:
      context: ./sysmind-agent
      dockerfile: Dockerfile
    container_name: sysmind-agent
    environment:
      - AGENT_PORT=${AGENT_PORT:-4000}
      - LM_STUDIO_BASE_URL=${AGENT_LM_STUDIO_BASE_URL:-http://host.docker.internal:1234}
      - LM_STUDIO_API_KEY=${AGENT_LM_STUDIO_API_KEY:-lm-studio}
      - LM_STUDIO_MODEL=${AGENT_LM_STUDIO_MODEL:-google/gemma-4-e4b}
      - MCP_BACKEND_URL=${AGENT_MCP_BACKEND_URL:-http://sysmind-mcp:8080}
      - MCP_ENDPOINT=${AGENT_MCP_ENDPOINT:-/mcp}
      - TOOL_TIMEOUT=${TOOL_TIMEOUT:-10s}
      - AGENT_TIMEOUT=${AGENT_TIMEOUT:-60s}
      - MAX_TOOL_CALLS_PER_USER_REQUEST=${MAX_TOOL_CALLS_PER_USER_REQUEST:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sysmind-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - sysmind-net

  # ── Next.js UI frontend ─────────────────────────────────────────────────────
  sysmind-ui:
    build:
      context: ./sysmind-ui
      dockerfile: Dockerfile
    container_name: sysmind-ui
    # Port no longer exposed to host — nginx proxies / internally
    environment:
      - AGENT_BACKEND_URL=${AGENT_BACKEND_URL:-http://sysmind-agent:4000}
    depends_on:
      sysmind-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - sysmind-net

  # ── Nginx reverse proxy (single public entry point) ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sysmind-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      sysmind-ui:
        condition: service_healthy
      sysmind-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - sysmind-net

networks:
  sysmind-net:
    driver: bridge

volumes:
  chroma-data:
